spring:
  application:
    name: querypilot

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/querypilot}
    username: ${DB_USERNAME:querypilot_readonly}
    password: ${DB_PASSWORD:querypilot_readonly_pw}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Default minimum-idle equals the pool size, so Hikari immediately
      # reopens a fresh idle connection right after
      # OptimizationValidationService evicts one to let CREATE DATABASE ...
      # TEMPLATE proceed - defeating that eviction every time. This app's
      # traffic is bursty single-request analysis, not sustained load, so a
      # warm pool buys nothing here and actively fights the sandbox clone.
      minimum-idle: 0

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Migrations need DDL rights the runtime datasource above no longer has,
    # so Liquibase gets its own connection using the admin role.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/querypilot}
    user: ${DB_ADMIN_USERNAME:querypilot}
    password: ${DB_ADMIN_PASSWORD:querypilot}

management:
  endpoints:
    web:
      exposure:
        include: health,info

querypilot:
  sandbox:
    admin-url: ${SANDBOX_ADMIN_URL:jdbc:postgresql://localhost:5433/postgres}
    database-name: querypilot_sandbox
    baseline-database-name: ${SANDBOX_BASELINE_DATABASE_NAME:querypilot}
    jdbc-url: ${SANDBOX_JDBC_URL:jdbc:postgresql://localhost:5433/querypilot_sandbox}
    # Superuser role: only used to drop/recreate the sandbox database and
    # to transfer sandbox table ownership after each clone.
    admin-username: ${DB_ADMIN_USERNAME:querypilot}
    admin-password: ${DB_ADMIN_PASSWORD:querypilot}
    # Least-privilege role used for the actual query/benchmark/CREATE INDEX
    # traffic against the disposable sandbox database. Cannot connect to
    # the primary querypilot database (see scripts/setup-security-roles.sql).
    username: ${SANDBOX_DB_USERNAME:querypilot_sandbox}
    password: ${SANDBOX_DB_PASSWORD:querypilot_sandbox_pw}

  ai:
    enabled: true
    api-key: ${GROQ_API_KEY}
    base-url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-20b